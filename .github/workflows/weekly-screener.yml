name: Weekly 52-Week Screener

on:
  schedule:
    - cron: "30 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas requests lxml openpyxl

      - name: Run screener
        run: python weekly_52w_screener.py

      - name: Show generated files
        run: |
          echo --- files in reports/latest/ ---
          ls -la reports/latest/ || echo no latest folder found

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-report-${{ github.run_id }}
          path: reports/latest/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/ || true
          if git diff --staged --quiet; then
            echo no new files to commit
          else
            git stash
            git pull --rebase origin main
            git stash pop
            git add -f reports/ || true
            git commit -m "Weekly screener report $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo report committed and pushed
          fi
